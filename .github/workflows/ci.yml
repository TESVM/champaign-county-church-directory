name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # package.json engines: >=20.9.0 <23
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client and schema
        run: |
          npx prisma generate
          npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Starts an in-memory Postgres (PGlite), applies every migration, and runs
      # the end-to-end service tests against it. No external database needed.
      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Dependency audit (production, critical)
        run: npm audit --omit=dev --audit-level=critical
